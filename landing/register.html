  <main class="register">
    <div class="container">
      <span class="eyebrow" data-r="eyebrow"></span>
      <h1 data-r="title"></h1>
      <p class="register-lede" data-r="lede"></p>

      <ol class="reg-progress" id="reg-progress">
        <li data-n="1"><span data-r="step1"></span></li>
        <li data-n="2"><span data-r="step2"></span></li>
        <li data-n="3"><span data-r="step3"></span></li>
        <li data-n="4"><span data-r="step4"></span></li>
        <li data-n="5"><span data-r="step5"></span></li>
      </ol>

      <form id="reg-form" novalidate>
        <!-- Step 1: the place -->
        <fieldset class="reg-step" data-step="1">
          <h2 data-r="placeTitle"></h2>

          <div class="reg-search">
            <div class="reg-box">
              <label class="reg-field">
                <span data-r="searchLabel"></span>
                <input id="reg-search" type="search" autocomplete="off" maxlength="100" data-r-placeholder="searchPlaceholder" />
              </label>
            </div>
            <ul class="reg-results reg-box" id="reg-results" hidden></ul>
          </div>

          <div class="reg-claim" id="reg-claim" hidden>
            <span id="reg-claim-text"></span>
            <button type="button" class="reg-link" id="reg-claim-cancel" data-r="claimCancel"></button>
          </div>

          <div>
            <p class="reg-label" data-r="kindLabel"></p>
            <div class="reg-kinds" id="reg-kinds"></div>
          </div>

          <div class="reg-box">
            <label class="reg-field">
              <span data-r="placeName"></span>
              <input id="reg-placeName" name="placeName" required maxlength="120" autocomplete="organization" />
            </label>
            <label class="reg-field">
              <span data-r="address"></span>
              <input id="reg-address" name="address" required maxlength="200" autocomplete="street-address" />
            </label>
            <div class="reg-pair">
              <label class="reg-field">
                <span data-r="postalCode"></span>
                <input id="reg-postalCode" name="postalCode" required maxlength="12" autocomplete="postal-code" />
              </label>
              <label class="reg-field">
                <span data-r="city"></span>
                <input id="reg-city" name="city" required maxlength="80" autocomplete="address-level2" />
              </label>
            </div>
            <div class="reg-pair reg-pair-even">
              <label class="reg-field">
                <span data-r="country"></span>
                <select id="reg-country" name="country" required>
                  <option value="ES">España</option>
                  <option value="PT">Portugal</option>
                  <option value="FR">France</option>
                  <option value="AD">Andorra</option>
                  <option value="IT">Italia</option>
                  <option value="BE">Belgique / België</option>
                  <option value="DE">Deutschland</option>
                  <option value="IE">Ireland</option>
                  <option value="GB">United Kingdom</option>
                </select>
              </label>
              <label class="reg-field">
                <span data-r="language"></span>
                <select id="reg-language" name="language" required>
                  <option value="es">Español</option>
                  <option value="en">English</option>
                  <option value="ca">Català</option>
                  <option value="va">Valencià</option>
                  <option value="gl">Galego</option>
                  <option value="pt">Português</option>
                  <option value="fr">Français</option>
                </select>
              </label>
            </div>
            <label class="reg-field">
              <span><span data-r="website"></span><em data-r="optionalFaster"></em></span>
              <input id="reg-website" name="website" maxlength="200" inputmode="url" autocomplete="url" />
            </label>
            <div class="reg-pair reg-pair-even">
              <label class="reg-field">
                <span data-r="legalName"></span>
                <input id="reg-legalName" name="legalName" required maxlength="160" />
              </label>
              <label class="reg-field">
                <span data-r="taxId"></span>
                <input id="reg-taxId" name="taxId" required maxlength="30" autocapitalize="characters" />
              </label>
            </div>
            <label class="reg-field">
              <span><span data-r="document"></span><em data-r="documentLimit"></em></span>
              <input id="reg-document" name="document" type="file" required accept="application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif" />
            </label>
          </div>
          <p class="reg-hint" data-r="documentHint"></p>
          <p class="reg-privacy" data-r-html="privacyNote"></p>

          <p class="reg-error" data-error hidden></p>
          <div class="reg-actions">
            <button type="button" class="btn btn-primary" data-next data-r="continue"></button>
          </div>
        </fieldset>

        <!-- Step 2: the person -->
        <fieldset class="reg-step" data-step="2" hidden>
          <h2 data-r="youTitle"></h2>
          <div class="reg-box">
            <div class="reg-pair reg-pair-even">
              <label class="reg-field">
                <span data-r="firstName"></span>
                <input id="reg-firstName" name="firstName" required maxlength="60" autocomplete="given-name" />
              </label>
              <label class="reg-field">
                <span data-r="lastName"></span>
                <input id="reg-lastName" name="lastName" required maxlength="80" autocomplete="family-name" />
              </label>
            </div>
            <label class="reg-field">
              <span data-r="role"></span>
              <input id="reg-role" name="role" required maxlength="80" autocomplete="organization-title" data-r-placeholder="rolePlaceholder" />
            </label>
            <label class="reg-field">
              <span><span data-r="phone"></span><em data-r="optional"></em></span>
              <input id="reg-phone" name="phone" type="tel" maxlength="30" autocomplete="tel" />
            </label>
            <label class="reg-hp" aria-hidden="true">
              Homepage
              <input id="reg-homepage" name="homepage" tabindex="-1" autocomplete="off" />
            </label>
          </div>

          <div class="reg-code-row">
            <div class="reg-box">
              <label class="reg-field">
                <span><span data-r="email"></span><em data-r="emailNote"></em></span>
                <input id="reg-email" name="email" type="email" required maxlength="200" autocomplete="email" />
              </label>
            </div>
            <button type="button" class="btn btn-outline" id="reg-send-code" data-r="sendCode"></button>
          </div>
          <div class="reg-code-row" id="reg-code-wrap" hidden>
            <div class="reg-box">
              <label class="reg-field">
                <span id="reg-code-label"></span>
                <input id="reg-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" pattern="\d{6}" />
              </label>
            </div>
            <button type="button" class="btn btn-outline" id="reg-check-code" data-r="checkCode"></button>
          </div>
          <p class="reg-hint" id="reg-dev-code" hidden></p>
          <p class="reg-ok" id="reg-email-ok" hidden></p>
          <p class="reg-privacy" data-r-html="privacyNote"></p>

          <p class="reg-error" data-error hidden></p>
          <div class="reg-actions">
            <button type="button" class="btn btn-outline" data-back data-r="back"></button>
            <button type="button" class="btn btn-primary" data-next data-r="continue"></button>
          </div>
        </fieldset>

        <!-- Step 3: the plan -->
        <fieldset class="reg-step" data-step="3" hidden>
          <h2 data-r="planTitle"></h2>
          <div class="reg-toggle" role="radiogroup">
            <label><input type="radio" name="billingInterval" value="monthly" /><span data-r="monthly"></span></label>
            <label><input type="radio" name="billingInterval" value="yearly" checked /><span data-r="yearly"></span></label>
          </div>
          <div class="reg-plans" id="reg-plans"></div>
          <p class="reg-hint" data-r="planHint"></p>
          <p class="reg-error" data-error hidden></p>
          <div class="reg-actions">
            <button type="button" class="btn btn-outline" data-back data-r="back"></button>
            <button type="button" class="btn btn-primary" data-next data-r="continue"></button>
          </div>
        </fieldset>

        <!-- Step 4: the agreement -->
        <fieldset class="reg-step" data-step="4" hidden>
          <h2 data-r="agreeTitle"></h2>
          <div class="reg-summary" id="reg-summary"></div>
          <div class="reg-checks">
            <label class="reg-check"><input type="checkbox" id="reg-acceptTerms" name="acceptTerms" required /><span data-r-html="acceptTerms"></span></label>
            <label class="reg-check"><input type="checkbox" id="reg-acceptDpa" name="acceptDpa" required /><span data-r-html="acceptDpa"></span></label>
            <label class="reg-check" id="reg-religious-wrap" hidden><input type="checkbox" id="reg-acceptReligiousData" name="acceptReligiousData" /><span data-r="acceptReligious"></span></label>
            <label class="reg-check"><input type="checkbox" id="reg-authorised" name="authorised" required /><span data-r="authorised"></span></label>
          </div>
          <div class="reg-precontract">
            <strong data-r="pcTitle"></strong>
            <ul>
              <li data-r="pc1"></li>
              <li data-r="pc2"></li>
              <li data-r="pc3"></li>
              <li data-r="pc4"></li>
              <li data-r-html="pc5"></li>
            </ul>
          </div>
          <div class="reg-box">
            <label class="reg-field reg-sign">
              <span data-r="signLabel"></span>
              <input id="reg-signedName" name="signedName" required maxlength="140" autocomplete="name" />
            </label>
            <div class="reg-field">
              <span data-r="date"></span>
              <span id="reg-date"></span>
            </div>
          </div>
          <p class="reg-error" data-error hidden></p>
          <div class="reg-actions">
            <button type="button" class="btn btn-outline" data-back data-r="back"></button>
            <button type="submit" class="btn btn-primary" id="reg-submit" data-r="submit"></button>
          </div>
        </fieldset>

        <!-- Step 5: sent -->
        <section class="reg-step" data-step="5" hidden>
          <h2 id="reg-thanks"></h2>
          <ol class="reg-timeline">
            <li><span class="reg-num done">✓</span><div><strong data-r="t1"></strong><p data-r="t1d"></p></div></li>
            <li><span class="reg-num">2</span><div><strong data-r="t2"></strong><p data-r="t2d"></p></div></li>
            <li><span class="reg-num">3</span><div><strong data-r="t3"></strong><p id="reg-t3d"></p></div></li>
          </ol>
          <div class="reg-actions" style="justify-content: flex-start;">
            <a class="btn btn-outline" href="index.html" data-r="backHome"></a>
          </div>
        </section>
      </form>
    </div>
  </main>
