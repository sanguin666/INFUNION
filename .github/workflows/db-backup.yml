name: Database backup

# A full copy of the production database every night, kept 30 days in a
# private Cloudflare R2 bucket (EU jurisdiction), separate from Railway, so
# a lost or broken database can be restored from outside Railway too.
#
# Restore (into an empty database, e.g. a new Railway Postgres):
#   aws s3 cp s3://$BUCKET/production/<file>.dump . --endpoint-url $ENDPOINT
#   pg_restore --no-owner --no-acl -d "$NEW_DATABASE_URL" <file>.dump
#
# Needs these repository secrets (Settings > Secrets and variables > Actions).
# Until they are set this workflow skips with a warning instead of failing.
#   PRODUCTION_DATABASE_URL   Railway > Postgres > Variables > DATABASE_PUBLIC_URL
#   BACKUP_S3_ENDPOINT        https://<account id>.eu.r2.cloudflarestorage.com
#   BACKUP_S3_BUCKET          e.g. infunion-backups (not the uploads bucket)
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY
#                             an R2 API token limited to that bucket

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      KEEP_DAYS: 30

    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$ENDPOINT" ] || [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::No backup made: add PRODUCTION_DATABASE_URL and the BACKUP_S3_* secrets (see the top of .github/workflows/db-backup.yml)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Postgres 17 client
        if: steps.secrets.outputs.skip != 'true'
        # pg_dump must be at least the server's version; 17 dumps 16 and 17.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and upload
        if: steps.secrets.outputs.skip != 'true'
        run: |
          set -euo pipefail
          file="infunion-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-acl --dbname="$DATABASE_URL" --file="$file"
          # A dump that can't be listed can't be restored: fail loudly now.
          /usr/lib/postgresql/17/bin/pg_restore --list "$file" > /dev/null
          aws s3 cp "$file" "s3://$BUCKET/production/$file" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Backed up $(du -h "$file" | cut -f1) as production/$file" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove backups older than ${{ env.KEEP_DAYS }} days
        if: steps.secrets.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-$KEEP_DAYS days" +%Y-%m-%d)
          aws s3 ls "s3://$BUCKET/production/" --endpoint-url "$ENDPOINT" | while read -r day _time _size name; do
            if [[ -n "$name" && "$day" < "$cutoff" ]]; then
              aws s3 rm "s3://$BUCKET/production/$name" --endpoint-url "$ENDPOINT" --only-show-errors
            fi
          done
