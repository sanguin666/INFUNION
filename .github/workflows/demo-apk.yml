name: Demo APK

# Builds the Android demo APK on GitHub's own machines instead of Expo's build
# servers, so it doesn't use up the Expo plan's monthly build allowance
# (`eas build --local` builds are not counted). It still signs with the same
# key EAS holds for com.infunion.app, so each new APK installs over the last.
#
# Run it from the Actions tab: "Demo APK" > "Run workflow". The APK lands on
# the "demo-apk" release, which always holds the latest build:
# https://github.com/sanguin666/INFUNION/releases/tag/demo-apk
#
# Needs one repository secret, EXPO_TOKEN (expo.dev > Account settings >
# Access tokens), so the build can read the version number and signing key.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Which code to build (the APK always talks to infunion-api)
        type: choice
        options: [production, staging, dev]
        default: production

# Two builds at once would race to replace the same release.
concurrency:
  group: demo-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check the Expo token is set
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first: repository Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The fingerprint of the native side, baked into the APK. Phones
      # compare theirs with this one (version.json on the release) to know a
      # newer APK is out, and over-the-air updates only go to the APK
      # carrying the same one.
      - name: Runtime version
        run: |
          runtime=$(npx expo-updates runtimeversion:resolve --platform android | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).runtimeVersion)')
          echo "RUNTIME_VERSION=$runtime" >> "$GITHUB_ENV"
          echo "Runtime version: $runtime"

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build --local --non-interactive \
            --profile preview --platform android --output "$RUNNER_TEMP/infunion.apk"

      - name: Publish on the demo-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          printf '{"runtimeVersion":"%s","commit":"%s","branch":"%s","builtAt":"%s"}\n' \
            "$RUNTIME_VERSION" "$sha" "${{ inputs.branch }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/version.json"
          gh release delete demo-apk --cleanup-tag --yes || true
          gh release create demo-apk "$RUNNER_TEMP/infunion.apk" "$RUNNER_TEMP/version.json" \
            --target "$sha" --prerelease \
            --title "Demo APK (${{ inputs.branch }}, $(date -u +'%d %b %Y %H:%M') UTC)" \
            --notes "Built from \`${{ inputs.branch }}\` at ${sha:0:7}. Open this page on the phone and tap infunion.apk to install."
          echo "APK: https://github.com/${{ github.repository }}/releases/tag/demo-apk" >> "$GITHUB_STEP_SUMMARY"
