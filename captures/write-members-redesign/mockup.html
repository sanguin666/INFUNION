<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write to members, proposed</title>
<link rel="stylesheet" href="../../admin/src/index.css">
<style>
  body { padding: 24px; box-sizing: border-box; }
  .wrap { max-width: 760px; }
  .steps { padding: 8px 28px 28px; }
  .step { padding: 22px 0; border-top: 1px solid var(--color-card-border); }
  .step:first-child { border-top: none; }
  .step-q { display: flex; gap: 12px; align-items: center; font-size: 22px; font-weight: 700; margin: 0 0 14px; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--color-primary); color: #fff;
         display: inline-flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .choice { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
            font-size: 19px; cursor: pointer; border: 1px solid transparent; margin-bottom: 8px; }
  .choice input { width: 22px; height: 22px; margin: 4px 0 0; accent-color: var(--color-primary); flex: none; }
  .choice.on { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .choice small { display: block; font-size: 16px; color: var(--color-text-muted); margin-top: 2px; }
  .choice-count { margin-left: auto; font-weight: 700; color: var(--color-primary-strong); white-space: nowrap; }
  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .field input, .field textarea { width: 100%; box-sizing: border-box; font: 400 20px system-ui, sans-serif; color: var(--color-text);
        border: 1px solid var(--color-card-border); border-radius: 12px; padding: 12px 14px; background: #fff; min-height: 52px; }
  .field textarea { min-height: 240px; line-height: 1.45; resize: vertical; }
  .hint { font-size: 16px; color: var(--color-text-muted); margin: 6px 2px 0; }
  .send-row { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .send-row .btn { font-size: 20px; min-height: 56px; width: 100%; }
  .note { font-size: 17px; color: var(--color-text-muted); margin: 0; text-align: center; }
  .btn-primary { border-color: var(--color-primary); }
</style></head>
<body>
<div class="wrap">
  <div style="margin-bottom:16px"><a class="btn" href="#">← All members</a></div>
  <h2 style="font-size:30px;margin:0 0 6px">Write to members</h2>
  <p class="muted" style="font-size:18px;margin:0 0 20px">Outside the app, by email, to the people on your list.</p>

  <div class="card" style="padding:0">
    <div class="steps">
      <div class="step">
        <p class="step-q"><span class="num">1</span>What do you want to say?</p>
        <label class="choice on"><input type="radio" name="k" checked>
          <span>Invite them to the app<small>Tap a button to join. It takes a minute.</small></span></label>
        <label class="choice"><input type="radio" name="k">
          <span>Ask for a contribution<small>A link to give on the web.</small></span></label>
        <label class="choice"><input type="radio" name="k">
          <span>Send a free message<small>Any note you like.</small></span></label>
      </div>

      <div class="step">
        <p class="step-q"><span class="num">2</span>Who gets it?</p>
        <label class="choice on"><input type="radio" name="a" checked>
          <span>People not in the app yet</span><span class="choice-count">24</span></label>
        <label class="choice"><input type="radio" name="a">
          <span>Everyone on the list</span><span class="choice-count">118</span></label>
      </div>

      <div class="step">
        <p class="step-q"><span class="num">3</span>Write the email</p>
        <label class="field"><span>Subject</span>
          <input value="Our community is now on infunion"></label>
        <label class="field"><span>Message</span>
          <textarea>Hello {name},

Our community is now on infunion: times, news and contributions, all on your phone.

Tap the button below to join us. It takes a minute.</textarea></label>
        <p class="hint">{name} becomes each person's first name.</p>
      </div>

      <div class="step">
        <p class="step-q"><span class="num">4</span>Send it</p>
        <div class="send-row">
          <button class="btn btn-primary" type="button">Send to 24 people</button>
          <button class="btn" type="button">Send myself a test first</button>
          <p class="note">This month: 0 of 10,000 emails sent.</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
